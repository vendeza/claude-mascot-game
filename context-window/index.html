<title>Context Window</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Silkscreen&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #171411;
    --panel: #201b17;
    --panel-2: #29221d;
    --line: #372e27;
    --text: #efe6dc;
    --muted: #a39487;
    --clawd: #d77757;
    --noise: #e0605a;
    --tool: #e2b457;
    --ok: #8fbf73;
    --sys: #6b5f55;
    --ghost: #b9a7e6;
    --ally: #7fb3d5;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    padding-inline: 16px;
    padding-block: 18px 40px;
  }
  .app { max-width: 1040px; margin: 0 auto; display: grid; gap: 14px; }

  .top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; }
  h1 {
    margin: 0;
    font-family: "Silkscreen", "IBM Plex Mono", monospace;
    font-weight: 400;
    font-size: clamp(22px, 4vw, 30px);
    line-height: 1.1;
    color: var(--clawd);
  }
  .meta { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .meta b { color: var(--text); font-weight: 500; }
  .mode { color: var(--tool); }
  .link {
    font: 13px "IBM Plex Mono", monospace; color: var(--muted);
    background: none; border: 1px solid var(--line); border-radius: 4px; padding: 2px 8px; cursor: pointer;
  }
  .link:hover { color: var(--text); }
  .link:focus-visible { outline: 2px solid var(--clawd); outline-offset: 2px; }

  .ctx { display: grid; gap: 6px; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
  .ctx-row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; font-size: 13px; font-variant-numeric: tabular-nums; }
  .ctx-row .val { font-weight: 500; }
  .ctx-row .val.warn { color: var(--tool); }
  .ctx-row .val.crit { color: var(--noise); }
  .bar { display: flex; height: 14px; background: #120f0d; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
  .bar span { display: block; height: 100%; transition: width .18s ease-out; }
  .seg-sys { background: var(--sys); }
  .seg-items { background: var(--clawd); }
  .seg-out { background: var(--tool); }
  .seg-noise { background: var(--noise); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: 0; }
  .cd-ready { color: var(--ok); }
  .cd-wait { color: var(--muted); }
  .status-extra { color: var(--muted); }

  .main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 14px; align-items: start; }
  @media (max-width: 820px) { .main { grid-template-columns: 1fr; } }

  .viewport { position: relative; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: #0d0b0a; }
  #game { display: block; width: 100%; height: auto; aspect-ratio: 264 / 216; image-rendering: pixelated; touch-action: none; }

  .hint {
    position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%);
    width: min(92%, 460px);
    padding: 8px 12px;
    font-size: 13px; line-height: 1.4;
    color: var(--text); background: rgba(32, 27, 23, 0.94);
    border: 1px solid var(--clawd); border-radius: 6px;
    pointer-events: none;
  }
  .hint[hidden] { display: none; }
  .hint b { color: var(--clawd); font-weight: 500; }

  .overlay {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    padding: 16px;
    background: rgba(13, 11, 10, 0.86);
    overflow-y: auto;
  }
  .overlay[hidden] { display: none; }
  .card { max-width: 460px; display: grid; gap: 12px; }
  .card h2 { margin: 0; font-family: "Silkscreen", monospace; font-weight: 400; font-size: 24px; line-height: 1.15; color: var(--clawd); text-wrap: balance; }
  .card h2.dead { color: var(--noise); }
  .card p { margin: 0; color: var(--muted); }
  .card ul { margin: 0; padding-left: 18px; color: var(--muted); display: grid; gap: 4px; font-size: 13px; }
  .card ul b { color: var(--text); font-weight: 500; }
  .card .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .card .lang { font-size: 13px; color: var(--muted); }
  .card .lang [aria-pressed="true"] { color: var(--clawd); border-color: var(--clawd); }
  .stats { display: grid; grid-template-columns: 1fr auto; gap: 2px 16px; font-size: 13px; font-variant-numeric: tabular-nums; margin: 0; }
  .stats dt { color: var(--muted); }
  .stats dd { margin: 0; text-align: right; }
  .perks { list-style: none; padding: 0 !important; font-size: 12px !important; }
  .perks li { display: flex; justify-content: space-between; gap: 12px; }
  .perks li.on { color: var(--ok); }
  .perks li.on span:first-child::before { content: "✓ "; }
  .perks li:not(.on) span:first-child::before { content: "· "; }
  .perks span:last-child { font-variant-numeric: tabular-nums; }
  .new-unlock { color: var(--ok) !important; }
  .primary, .secondary {
    font: 500 14px "IBM Plex Mono", monospace;
    border-radius: 6px; padding: 10px 16px; cursor: pointer;
  }
  .primary { color: #1a120e; background: var(--clawd); border: 0; }
  .secondary { color: var(--tool); background: none; border: 1px solid #5a4a2e; }
  .primary:focus-visible, .secondary:focus-visible, .btn:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

  .side { display: grid; gap: 12px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px; display: grid; gap: 8px; }
  .panel h3 { margin: 0; font-size: 11px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

  .tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .btn {
    display: grid; gap: 0; justify-items: start;
    font: 13px "IBM Plex Mono", monospace; text-align: left;
    color: var(--text); background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 5px;
    padding: 6px 8px; cursor: pointer; min-height: 44px;
  }
  .btn small { font-size: 11px; color: var(--muted); }
  .btn:hover:not(:disabled) { border-color: #5a4a3e; }
  .btn:disabled { opacity: .38; cursor: default; }
  .btn.tool b { color: var(--tool); font-weight: 500; }
  .btn.compact b { color: var(--clawd); font-weight: 500; }
  .btn.clear b { color: #5fb3c4; font-weight: 500; }
  .btn.sub b { color: var(--ally); font-weight: 500; }

  .pad { display: grid; grid-template-columns: repeat(3, 52px); grid-template-rows: repeat(3, 44px); gap: 4px; justify-content: center; }
  .pad .btn { justify-items: center; align-items: center; padding: 0; font-size: 16px; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: none; }
  .pad .up { grid-area: 1 / 2; } .pad .left { grid-area: 2 / 1; } .pad .wait { grid-area: 2 / 2; font-size: 11px; }
  .pad .right { grid-area: 2 / 3; } .pad .down { grid-area: 3 / 2; }
  @media (hover: hover) and (pointer: fine) and (min-width: 821px) { .pad-panel { display: none; } }

  .inv { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .inv li { display: grid; grid-template-columns: 1fr auto; gap: 0 8px; align-items: center; padding: 6px 8px; background: var(--panel-2); border-radius: 5px; }
  .inv .nm { font-weight: 500; }
  .inv .nm em { font-style: normal; font-size: 11px; color: var(--tool); border: 1px solid #5a4a2e; border-radius: 3px; padding: 0 4px; margin-left: 6px; }
  .inv .ds { grid-column: 1; font-size: 12px; color: var(--muted); line-height: 1.35; }
  .inv .sz { font-size: 12px; color: var(--clawd); font-variant-numeric: tabular-nums; }
  .inv button { grid-row: 1 / span 2; grid-column: 2; font: 12px "IBM Plex Mono", monospace; color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; cursor: pointer; }
  .inv button:hover { color: var(--text); }
  .inv .empty { color: var(--muted); font-size: 12px; background: none; padding: 0; }

  .log { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; font-size: 12px; line-height: 1.4; color: var(--muted); min-height: 7.5em; }
  .log li::before { content: "⎿ "; color: #5a4a3e; }
  .log .tool { color: var(--tool); }
  .log .hit { color: var(--noise); }
  .log .ok { color: var(--ok); }
  .log .sys { color: var(--clawd); }
  .log .ghost { color: var(--ghost); }
  .log .ally { color: var(--ally); }
  .log li:last-child { color: var(--text); }
  .log li.tool:last-child { color: var(--tool); } .log li.hit:last-child { color: var(--noise); }
  .log li.ok:last-child { color: var(--ok); } .log li.sys:last-child { color: var(--clawd); }
  .log li.ghost:last-child { color: var(--ghost); } .log li.ally:last-child { color: var(--ally); }

  .keys { font-size: 12px; color: var(--muted); margin: 0; }
  .keys kbd { font: 11px "IBM Plex Mono", monospace; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; color: var(--text); }
  footer { font-size: 12px; color: var(--muted); }
</style>

<div class="app">
  <div class="top">
    <h1>Context Window</h1>
    <div class="meta">
      <span class="mode" id="mode"></span>
      <span><span data-i18n="floor">Floor</span> <b id="floor">1</b></span>
      <span><span data-i18n="score">Score</span> <b id="score">0</b></span>
      <span><span data-i18n="best">Best</span> <b id="best">0</b></span>
      <button class="link" id="mute" type="button">Sound: on</button>
      <button class="link" id="music" type="button">Music: on</button>
      <button class="link" id="track" type="button">Track: Auto</button>
    </div>
  </div>

  <section class="ctx" data-i18n-aria="ctxAria" aria-label="Context window">
    <div class="ctx-row">
      <span><span data-i18n="ctx">Context</span> <span class="val" id="ctx-val">16k / 200k</span></span>
      <span>/compact: <span id="cd" class="cd-ready">ready</span> <span class="status-extra" id="eff"></span><span class="status-extra" id="extra"></span></span>
    </div>
    <div class="bar" aria-hidden="true">
      <span class="seg-sys" id="seg-sys"></span><span class="seg-items" id="seg-items"></span><span class="seg-out" id="seg-out"></span><span class="seg-noise" id="seg-noise"></span>
    </div>
    <div class="legend">
      <span><i style="background:var(--sys)"></i><span data-i18n="lgSys">system prompt</span> <span id="lg-sys">12k</span></span>
      <span><i style="background:var(--clawd)"></i><span data-i18n="lgItems">items</span> <span id="lg-items">4k</span></span>
      <span><i style="background:var(--tool)"></i><span data-i18n="lgOut">tool output</span> <span id="lg-out">0k</span></span>
      <span><i style="background:var(--noise)"></i><span data-i18n="lgNoise">damage noise</span> <span id="lg-noise">0k</span></span>
    </div>
  </section>

  <div class="main">
    <div class="viewport">
      <canvas id="game" width="1056" height="864" data-i18n-aria="gameAria" aria-label="Game board"></canvas>
      <div class="hint" id="hint" hidden></div>
      <div class="overlay" id="overlay">
        <div class="card" id="card"></div>
      </div>
    </div>

    <aside class="side">
      <section class="panel">
        <h3 data-i18n="hActions">Actions</h3>
        <div class="tools">
          <button class="btn tool" id="b-read" type="button"><b>Read</b><small>R</small></button>
          <button class="btn tool" id="b-grep" type="button"><b>Grep</b><small>G</small></button>
          <button class="btn tool" id="b-bash" type="button"><b>Bash</b><small>B</small></button>
          <button class="btn compact" id="b-compact" type="button"><b>/compact</b><small>C</small></button>
          <button class="btn sub" id="b-sub" type="button"><b>Subagent</b><small>Q</small></button>
          <button class="btn clear" id="b-clear" type="button"><b>/clear</b><small>X</small></button>
        </div>
        <button class="btn" id="b-wait" type="button"><b data-i18n="wait">Wait a turn</b><small data-i18n="space">Space</small></button>
      </section>

      <section class="panel pad-panel">
        <div class="pad">
          <button class="btn up" type="button" data-dir="0,-1" data-i18n-aria="up" aria-label="Up">▲</button>
          <button class="btn left" type="button" data-dir="-1,0" data-i18n-aria="left" aria-label="Left">◀</button>
          <button class="btn wait" type="button" data-wait="1" data-i18n-aria="waitAria" aria-label="Wait"><span data-i18n="padWait">wait</span></button>
          <button class="btn right" type="button" data-dir="1,0" data-i18n-aria="right" aria-label="Right">▶</button>
          <button class="btn down" type="button" data-dir="0,1" data-i18n-aria="down" aria-label="Down">▼</button>
        </div>
      </section>

      <section class="panel">
        <h3 data-i18n="hLog">Session log</h3>
        <ul class="log" id="log" aria-live="polite"></ul>
      </section>

      <section class="panel">
        <h3 data-i18n="hInv">In context</h3>
        <ul class="inv" id="inv"></ul>
      </section>

      <p class="keys" data-i18n-html="keysHelp"></p>
    </aside>
  </div>

  <footer data-i18n="footer">Fan game. Not affiliated with or made by Anthropic.</footer>
</div>

<script>
(() => {
  'use strict';
  const $ = s => document.querySelector(s);
  const el = id => document.getElementById(id);

  // ---------- constants ----------
  const TS = 24, VW = 11, VH = 9, LW = VW * TS, LH = VH * TS, S = 4;
  const MW = 40, MH = 28;
  const MAX = 200, SYS = 12, COMPACT_CD = 15;
  const COL = {
    clawd: '#d77757', bg: '#120f0d', void: '#0d0b0a', noise: '#e0605a', tool: '#e2b457',
    ok: '#8fbf73', white: '#fff4ea', bug: '#7fb069', ghost: '#b9a7e6', loop: '#6fa8dc',
    merge: '#b8566b', mergeHi: '#d77a8e', clear: '#5fb3c4', dust: '#6b5a4c', flash: '#f0a58a',
    ally: '#7fb3d5', flakyOk: '#8fbf73', flakyBad: '#e0605a', limiter: '#d9a441',
    stone: '#3d3833', stoneHi: '#57504a', stoneLo: '#26221f'
  };

  const ITEMS = {
    read:     { name: 'Read', kind: 'tool', size: 4, cost: 3, key: 'R', desc: s => tr('d_read', s) },
    grep:     { name: 'Grep', kind: 'tool', size: 8, cost: 8, key: 'G', desc: s => tr('d_grep', s) },
    bash:     { name: 'Bash', kind: 'tool', size: 12, cost: 10, key: 'B', desc: s => tr('d_bash', s) },
    claudemd: { name: 'CLAUDE.md', kind: 'passive', size: 10, desc: s => tr('d_claudemd', s) },
    thinking: { name: 'Extended Thinking', kind: 'passive', size: 8, desc: s => tr('d_thinking', s) },
    pcache:   { name: 'Prompt Cache', kind: 'passive', size: 6, desc: s => tr('d_pcache', s) },
    subagent: { name: 'Subagent', kind: 'consumable', size: 3, key: 'Q', desc: s => tr('d_subagent', s) },
    clear:    { name: '/clear', kind: 'consumable', size: 2, key: 'X', desc: s => tr('d_clear', s) },
    cache:    { name: 'Cache Hit', kind: 'instant', size: 0, desc: s => tr('d_cache', s) },
  };
  const FOES = {
    bug:     { name: 'Bug', hp: 1, dmg: 10, score: 10 },
    ghost:   { name: 'Hallucination', hp: 2, dmg: 16, score: 15 },
    mimic:   { name: 'Hallucination', hp: 2, dmg: 16, score: 15 },
    loop:    { name: 'Infinite Loop', hp: 2, dmg: 7, score: 15 },
    merge:   { name: 'Merge Conflict', hp: 1, dmg: 12, score: 20 },
    flaky:   { name: 'Flaky Test', hp: 2, dmg: 9, score: 20 },
    limiter: { name: 'Rate Limiter', hp: 2, dmg: 4, score: 25 },
    module:  { name: 'Legacy Monolith', hp: 5, dmg: 18, score: 40 },
  };
  const HP_STEP = { bug: 3, ghost: 4, loop: 4, merge: 5, flaky: 4, limiter: 5 };
  const PERKS = [
    { at: 400, item: 'grep' },
    { at: 1200, item: 'subagent' },
    { at: 2500, item: 'pcache' },
    { at: 4500, item: 'claudemd' },
  ];
  const perkLabel = p => tr('perk', ITEMS[p.item].name);
  const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];

  // ---------- rng ----------
  let rng = Math.random;
  function seedRng(seed) {
    let a = seed >>> 0;
    rng = () => {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const ri = (a, b) => a + Math.floor(rng() * (b - a + 1));
  const chance = p => rng() < p;
  const pick = a => a[Math.floor(rng() * a.length)];
  // visual-only randomness, never affects the run
  const vr = (a, b) => a + Math.random() * (b - a);

  // ---------- utils ----------
  const idx = (x, y) => y * MW + x;
  const inb = (x, y) => x >= 0 && y >= 0 && x < MW && y < MH;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const ease = k => { k = clamp(k, 0, 1); return 1 - (1 - k) * (1 - k); };
  const manh = (a, b) => Math.abs(a.x - b.x) + Math.abs(a.y - b.y);
  const hash = (x, y) => {
    let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return (h ^ (h >>> 16)) >>> 0;
  };
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };
  function plural(n, a, b, c) { const m = n % 10, h = n % 100; if (m === 1 && h !== 11) return a; if (m >= 2 && m <= 4 && (h < 10 || h >= 20)) return b; return c; }
  function today() {
    const d = new Date();
    return { seed: d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(), label: `${String(d.getDate()).padStart(2, '0')}.${String(d.getMonth() + 1).padStart(2, '0')}` };
  }

  // ---------- persistent ----------
  let best = parseInt(store.get('cw-best') || '0', 10) || 0;
  let commits = parseInt(store.get('cw-meta') || '0', 10) || 0;
  let muted = store.get('cw-mute') === '1';
  let hintsSeen = {};
  try { hintsSeen = JSON.parse(store.get('cw-hints') || '{}') || {}; } catch (e) { hintsSeen = {}; }
  const dailyKey = () => 'cw-daily-' + today().seed;
  const dailyBest = () => parseInt(store.get(dailyKey()) || '0', 10) || 0;


  // ---------- localization ----------
  const I18N = {
    en: {
      floor: 'Floor', score: 'Score', best: 'Best', soundOn: 'Sound: on', soundOff: 'Sound: off', musicOn: 'Music: on', musicOff: 'Music: off', track: 'Track', trackAuto: 'Auto',
      ctx: 'Context', ctxAria: 'Context window', gameAria: 'Game board', ready: 'ready',
      inTurns: n => `in ${n} ${n === 1 ? 'turn' : 'turns'}`, eff: p => `· ${p}% compression`,
      grepLeft: n => `Grep ${n} more`, allyLeft: n => `subagent ${n}`, frozen: '429: frozen',
      lgSys: 'system prompt', lgItems: 'items', lgOut: 'tool output', lgNoise: 'damage noise',
      hActions: 'Actions', hLog: 'Session log', hInv: 'In context', wait: 'Wait a turn', space: 'Space', padWait: 'wait',
      waitAria: 'Wait', up: 'Up', left: 'Left', right: 'Right', down: 'Down',
      keysHelp: '<kbd>←↑↓→</kbd>/<kbd>WASD</kbd> or swipe to move, hold to run, step into an enemy to attack. <kbd>M</kbd> sound, <kbd>N</kbd> music, <kbd>T</kbd> track.',
      footer: 'Fan game. Not affiliated with or made by Anthropic.',
      daily: d => `Daily ${d}`, invEmpty: 'Empty. Items are scattered across floors.', forget: 'Forget',
      forgetTitle: n => `Remove ${n} from context`, summary: 'summary', notFound: n => `${n} not found yet`, perk: n => `Start with ${n}`,
      d_read: s => `Dispels hallucinations within ${s ? 2 : 4} tiles`,
      d_grep: s => `Reveals the whole floor for ${s ? 6 : 12} turns`,
      d_bash: s => `${s ? 1 : 2} damage to every adjacent tile`,
      d_claudemd: () => 'Compaction never summarizes your items',
      d_thinking: s => s ? '+1 damage at 50% chance, each hit +1k' : '+1 damage, but each hit adds 1k output',
      d_pcache: s => `Tools cost ${s ? 25 : 50}% less`,
      d_subagent: () => 'A clone fights for 12 turns; its damage never enters your context',
      d_clear: () => 'Wipes the context, items included',
      d_cache: () => '−25k noise',
      h_enemy: 'Enemy in sight. <b>Step into it</b> to attack. Arrows above enemies show their next move, <b>!</b> means a hit.',
      h_item: 'Items take up context. <b>Step on one</b> to pick it up. Forget what you don\u2019t need in the side panel.',
      h_ctx: 'Context is half full. <b>/compact (C)</b> squeezes noise and output, but each compaction is weaker than the last.',
      h_stairs: 'The green arrow is <b>git push</b>, the way down. Every floor adds 6k of history.',

  // ---------- map generation ----------
  function carve(x, y) { if (x > 0 && y > 0 && x < MW - 1 && y < MH - 1) map[idx(x, y)] = 0; }

  function kill(e, by) {
    ents = ents.filter(o => o !== e);
    const f = FOES[e.type];
    const pts = e.copy ? 5 : f.score;
    G.score += pts; G.stats.kills++;
    G.hitstop = 0.05;
    sfx('kill');
    const c = { bug: COL.bug, ghost: COL.ghost, mimic: COL.ghost, loop: COL.loop, merge: COL.merge, flaky: COL.flakyOk, limiter: COL.limiter, module: COL.stoneHi }[e.type];
    burst(wx(e.x), wy(e.y), e.type === 'module' ? 30 : 14, c, 35, wy(e.y));
    const loud = by === 'player' || by === 'ally';
    if (e.type === 'module') { moduleDown(e); return; }
    if (e.type === 'merge') {
      const partner = ents.find(o => o.type === 'merge' && o.pair === e.pair);
      if (partner) {
        partner.revive = { x: e.x, y: e.y, sym: e.sym }; partner.reviveT = 3;
        log(tr('l_mergeHalf'), 'sys');
      } else {
        G.score += 20;
        log(tr('l_mergeDone'), 'ok');
        text('resolved', COL.ok, wx(e.x), wy(e.y) - 20);
      }
    } else if (loud) {
      log(tr('l_killed', f.name, by === 'ally', pts), by === 'ally' ? 'ally' : 'ok');
    }
  }

  function moduleDown(e) {
    const B = G.boss;
    const left = ents.filter(o => o.type === 'module').length;
    shake(0.25);
    log(tr('l_module', 4 - left), 'ok');
    if (left === 0) {
      B.dead = true; B.slam = false;
      musicPlay(trackFor(G.floor, false));
      stairs = { x: B.bx, y: B.by };
      G.score += 300; G.stats.bosses++;
      shake(0.5); sfx('boss');
      for (let i = 0; i < 4; i++) burst(wx(B.bx + (i % 2)), wy(B.by + (i >> 1)), 20, () => pick([COL.stoneHi, COL.clawd, COL.tool]), 50, wy(B.by + (i >> 1)));
      text('REFACTORED', COL.ok, wx(B.bx) + 12, wy(B.by) - 30);
      log(tr('l_bossDead'), 'ok');
    }
  }

  function hurt(k, by) {
    G.noise += k; G.stats.noise += k; G.killedBy = by;
    G.interrupt = true;
    setAnim('hurt');
    shake(0.18);
    sfx('hurt');
    text(`+${k}k`, COL.noise, wx(P.x), wy(P.y) - 22);
    burst(wx(P.x), wy(P.y), 8, COL.noise, 25, wy(P.y));
    log(tr('l_hurt', by, k), 'hit');
  }

  function pickup() {
    const i = floorItems.findIndex(o => o.x === P.x && o.y === P.y);
    if (i < 0) return;
    const it = floorItems[i], def = ITEMS[it.id];
    if (def.kind === 'instant') {
      const healed = Math.min(25, G.noise);
      G.noise -= healed;
      floorItems.splice(i, 1);
      sfx('pickup');
      text(`−${healed}k`, COL.ok, wx(P.x), wy(P.y) - 22);
      log(tr('l_cache', healed), 'ok');
      return;
    }
    if (has(it.id)) { log(tr('l_already', def.name)); return; }
    if (total() + def.size > MAX) { log(tr('l_noFit', def.name, def.size), 'hit'); return; }
    G.items.push({ id: it.id, sum: false });
    floorItems.splice(i, 1);
    setAnim('happy');
    sfx('pickup');
    text(`+ ${def.name}`, COL.clawd, wx(P.x), wy(P.y) - 22);
    log(tr('l_picked', def.name, def.size, def.desc(false)), 'sys');
  }

  function descend() {
    G.score += 100;
    setAnim('push', { lock: 1.2 });
    sfx('stairs');
    text('git push ✓', COL.ok, wx(P.x), wy(P.y) - 30);
    log(tr('l_push', G.floor), 'ok');
    G.trans = { t: 0, swapped: false };
  }

  function useTool(id) {
    const def = ITEMS[id];
    if (!has(id)) { log(tr('l_noTool', def.name)); return false; }
    const cost = toolCost(id);
    if (total() + cost > MAX && G.cd > 0) { log(tr('l_noCtx', def.name), 'hit'); return false; }
    const it = getItem(id);
    G.output += cost; G.stats.tools += cost;
    setAnim('tool', { lock: 0.2 });
    sfx('tool');
    text(`${def.name}() +${cost}k`, COL.tool, wx(P.x), wy(P.y) - 24);

    if (id === 'read') {
      const R = it.sum ? 2 : 4;
      const hit = ents.filter(e => (e.type === 'mimic' || e.type === 'ghost') && Math.hypot(e.x - P.x, e.y - P.y) <= R + 0.01);
      hit.forEach(e => { burst(wx(e.x), wy(e.y), 12, COL.ghost, 30, wy(e.y)); kill(e, 'read'); });
      rings.push({ x: wx(P.x), y: wy(P.y) - 6, r: 4, max: R * TS, life: 1, c: COL.ghost });
      log(hit.length ? tr('l_read', hit.length) : tr('l_readNone'), 'tool');
    } else if (id === 'grep') {
      G.grep = it.sum ? 6 : 12;
      for (let i = 0; i < seen.length; i++) if (map[i] === 0 || wallShow[i]) seen[i] = 1;
      rings.push({ x: wx(P.x), y: wy(P.y) - 6, r: 4, max: 140, life: 1, c: COL.tool });
      log(tr('l_grep', G.grep), 'tool');
    } else if (id === 'bash') {
      if (chance(0.1)) {
        sfx('denied');
        log(tr('l_denied'), 'hit');
        text('Permission denied', COL.noise, wx(P.x), wy(P.y) - 32);
      } else {
        const dmg = it.sum ? 1 : 2;
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
          if (!dx && !dy) continue;
          part({ x: wx(P.x + dx), y: wy(P.y + dy) - 6, vx: dx * 20, vy: dy * 20 - 10, life: 0.35, c: COL.tool, size: 2 });
        }
        shake(0.1);
        const hit = ents.filter(e => Math.abs(e.x - P.x) <= 1 && Math.abs(e.y - P.y) <= 1);
        const before = G.stats.kills;
        hit.forEach(e => damage(e, dmg, 'bash'));
        log(tr('l_bash', hit.length, G.stats.kills - before), 'tool');
      }
    }
    return true;
  }

  function useSubagent() {
    if (!has('subagent')) { log(tr('l_noSub')); return false; }
    const spot = adjacentFree(P.x, P.y);
    if (!spot) { log(tr('l_subNoSpace')); return false; }
    G.items = G.items.filter(i => i.id !== 'subagent');
    allies.push({ x: spot[0], y: spot[1], px: P.x, py: P.y, moveT: 0, life: 12, atkT: 1, adx: 0, ady: 0, face: P.face });
    sfx('ally');
    burst(wx(spot[0]), wy(spot[1]), 12, COL.ally, 30, wy(spot[1]));
    text('Task(subagent)', COL.ally, wx(P.x), wy(P.y) - 26);
    log(tr('l_subStart'), 'ally');
    hint('ally');
    return true;
  }

  function doCompact(auto) {
    const before = total();
    const eff = compactEff();
    G.noise = Math.floor(G.noise * (1 - eff));
    G.output = Math.floor(G.output * (1 - eff));
    const pinned = has('claudemd');
    const hit = [];
    if (!pinned) G.items.forEach(it => {
      if (it.sum || it.id === 'clear' || it.id === 'subagent') return;
      if (chance(0.4)) { it.sum = true; hit.push(ITEMS[it.id].name); }
    });
    G.cd = COMPACT_CD; G.stats.compactions++;
    setAnim('compact', { lock: 0.5 });
    sfx('compact');
    text('● Compacting…', COL.clawd, wx(P.x), wy(P.y) - 26);
    for (let i = 0; i < 24; i++) {
      const a = vr(0, Math.PI * 2), r = vr(18, 34);
      part({ x: wx(P.x) + Math.cos(a) * r, y: wy(P.y) - 6 + Math.sin(a) * r * 0.7, tx: wx(P.x), ty: wy(P.y) - 6, life: vr(0.35, 0.55), c: i % 2 ? COL.noise : COL.tool });
    }
    log(tr('l_compact', auto, Math.round(eff * 100), before, total(), hit.join(', ')), 'sys');
  }

  function manualCompact() {
    if (G.cd > 0) { log(tr('l_cdWait', G.cd)); return false; }
    doCompact(false);
    return true;
  }

  function useClear() {
    if (!has('clear')) { log(tr('l_noClear')); return false; }
    const before = total();
    G.items = []; G.noise = 0; G.output = 0;
    setAnim('compact', { lock: 0.5 });
    sfx('compact');
    text('/clear', COL.clear, wx(P.x), wy(P.y) - 26);
    burst(wx(P.x), wy(P.y), 20, COL.clear, 40, wy(P.y));
    log(tr('l_clear', before, total()), 'sys');
    return true;
  }

  function dropItem(id) {
    if (!G.started || G.over) return;
    const it = getItem(id); if (!it) return;
    const sz = itemSize(it);
    G.items = G.items.filter(i => i !== it);
    log(tr('l_forgot', ITEMS[id].name, sz));
    hud();
  }

  function checkOverflow() {
    if (total() >= MAX && G.cd === 0) doCompact(true);
    if (total() > MAX) die();
  }

  function die() {
    G.over = true;
    held.length = 0;
    setAnim('death');
    sfx('death');
    musicStop();
    shake(0.4);
    G.earned = G.score;
    G.newPerks = [];
    if (G.mode === 'daily') {
      if (G.score > dailyBest()) store.set(dailyKey(), String(G.score));
    } else {
      if (G.score > best) { best = G.score; store.set('cw-best', String(best)); }
      const was = commits;
      commits += G.score;
      store.set('cw-meta', String(commits));
      G.newPerks = PERKS.filter(p => was < p.at && commits >= p.at);
    }
    log(tr('l_death', G.killedBy || tr('noiseSrc')), 'hit');
  }

  function endTurn() {
    G.turn++;
    if (G.turn % 2 === 0) G.output += 1;
    if (G.cd > 0) G.cd--;
    if (G.grep > 0) G.grep--;
    dist = bfsFrom(P.x, P.y);
    allyTurn();
    for (const e of ents.slice()) {
      if (!ents.includes(e) || G.over) continue;
      enemyAct(e);
    }
    bossTurn();
    if (G.turn % 6 === 0) {
      // only original loops replicate, at most twice each and 6 copies per floor
      const loops = ents.filter(e => e.type === 'loop' && e.awake && !e.copy && (e.spawned || 0) < 2);
      for (const e of loops) {
        if (G.loopCopies >= 6) break;
        const spot = adjacentFree(e.x, e.y);
        if (!spot) continue;
        e.spawned = (e.spawned || 0) + 1;
        G.loopCopies++;
        ents.push(makeEnt('loop', spot[0], spot[1], { awake: true, px: e.x, py: e.y, moveT: 0, copy: true }));
        if (vis[idx(spot[0], spot[1])]) { log(tr('l_loopMult'), 'hit'); text('+1', COL.loop, wx(spot[0]), wy(spot[1]) - 18); }
      }
    }
    for (const e of ents.slice()) {
      if (e.reviveT > 0) {
        e.reviveT--;
        if (e.reviveT === 0 && e.revive) {
          let spot = null;
          const cands = [[e.revive.x, e.revive.y], ...DIRS.map(([dx, dy]) => [e.revive.x + dx, e.revive.y + dy])];
          for (const [x, y] of cands) if (isFloor(x, y) && !occupied(x, y)) { spot = [x, y]; break; }
          if (spot) {
            ents.push(makeEnt('merge', spot[0], spot[1], { pair: e.pair, sym: e.revive.sym, awake: true }));
            log(tr('l_mergeBack'), 'hit');
            text('<<<>>>', COL.merge, wx(spot[0]), wy(spot[1]) - 18);
          }
          e.revive = null;
        }
      }
    }
    computeFOV();
    computeIntents();
    if (!G.over) checkOverflow();
    if (!G.over && total() >= MAX / 2) hint('ctx');
  }

  function stepToward(o, d) {
    let bd = d[idx(o.x, o.y)], best = null;
    if (bd < 0) return null;
    for (const [dx, dy] of DIRS) {
      const nx = o.x + dx, ny = o.y + dy;
      if (!isFloor(nx, ny) || occupied(nx, ny)) continue;
      const nd = d[idx(nx, ny)];
      if (nd >= 0 && nd < bd) { bd = nd; best = [nx, ny, dx]; }
    }
    return best;
  }

  function allyTurn() {
    for (const a of allies.slice()) {
      a.life--;
      if (a.life <= 0) {
        allies = allies.filter(o => o !== a);
        burst(wx(a.x), wy(a.y), 12, COL.ally, 25, wy(a.y));
        log(tr('l_subDone'), 'ally');
        continue;
      }
      let target = null, td = 1e9;
      for (const e of ents) {
        if (!isFoe(e) || !(vis[idx(e.x, e.y)] || G.grep > 0)) continue;
        const m = manh(a, e);
        if (m < td && m <= 10) { td = m; target = e; }
      }
      if (target && td === 1) {
        a.atkT = 0; a.adx = target.x - a.x; a.ady = target.y - a.y;
        if (a.adx) a.face = a.adx;
        damage(target, 1, 'ally');
        continue;
      }
      let step = null;
      if (target) step = stepToward(a, bfsFrom(target.x, target.y));
      else if (manh(a, P) > 2) step = stepToward(a, dist);
      if (step) { a.px = a.x; a.py = a.y; a.x = step[0]; a.y = step[1]; a.moveT = 0; if (step[2]) a.face = step[2]; }
    }
  }

  function enemyAct(e) {
    if (e.type === 'mimic' || e.type === 'module') return;
    const d = dist[idx(e.x, e.y)];
    if (!e.awake) {
      if (d >= 0 && ((vis[idx(e.x, e.y)] && d <= 8) || (G.grep > 0 && d <= 10))) e.awake = true;
      else return;
    }
    if (d < 0) return;
    if (e.type === 'loop' && G.turn % 2) return;
    if (manh(e, P) === 1) {
      e.atkT = 0; e.adx = P.x - e.x; e.ady = P.y - e.y;
      if (e.adx) e.face = e.adx;
      hurt(scaled(FOES[e.type].dmg), FOES[e.type].name);
      if (e.type === 'limiter' && !G.frozen) {
        G.frozen = 2; G.frozenT = 0;
        sfx('freeze');
        text('429 Too Many Requests', COL.limiter, wx(P.x), wy(P.y) - 32);
        log(tr('l_frozen'), 'hit');
        hint('frozen');
      }
      return;
    }
    const step = stepToward(e, dist);
    if (step) { e.px = e.x; e.py = e.y; e.x = step[0]; e.y = step[1]; e.moveT = 0; if (step[2]) e.face = step[2]; }
  }

  function inSlam(x, y) {
    return ents.some(m => m.type === 'module' && Math.max(Math.abs(x - m.x), Math.abs(y - m.y)) <= 2);
  }

  function bossTurn() {
    const B = G.boss;
    if (!B || B.dead || !B.awake) return;
    const mods = ents.filter(e => e.type === 'module');
    if (!mods.length) return;
    B.timer++;
    if (B.slam) {
      B.slam = false;
      shake(0.4); sfx('slam');
      mods.forEach(m => rings.push({ x: wx(m.x), y: wy(m.y) - 8, r: 4, max: 60, life: 1, c: COL.noise }));
      if (inSlam(P.x, P.y)) hurt(scaled(22), 'Legacy Monolith');
      else log(tr('l_slamMiss'), 'ok');
      allies.forEach(a => { if (inSlam(a.x, a.y)) a.life = Math.min(a.life, 1); });
      return;
    }
    if (B.timer % 4 === 0) {
      B.slam = true;
      G.interrupt = true;
      sfx('warn');
      log(tr('l_slamWarn'), 'hit');
      return;
    }
    const adj = mods.find(m => manh(m, P) === 1);
    if (adj) {
      adj.atkT = 0; adj.adx = P.x - adj.x; adj.ady = P.y - adj.y;
      hurt(scaled(FOES.module.dmg), 'Legacy Monolith');
      return;
    }
    if (B.timer % 5 === 0 && ents.filter(e => e.type === 'bug').length < 6) {
      const m = pick(mods), spot = adjacentFree(m.x, m.y);
      if (spot) {
        ents.push(makeEnt('bug', spot[0], spot[1], { awake: true, px: m.x, py: m.y, moveT: 0 }));
        log(tr('l_techDebt'), 'hit');
      }
    }
  }

  // ---------- Clawd sprite ----------
  function basePose() {
    return { bodyDy: 0, eye: 2, look: 0, armL: [0, 0], armR: [0, 0], legs: [0, 0, 0, 0], ox: 0, oy: 0, sx: 1, sy: 1, tint: null, alpha: 1 };
  }
  function paintSprite(p, color) {
    sc.clearRect(0, 0, spr.width, spr.height);
    sc.fillStyle = p.tint || color || COL.clawd;
    const px = (c, r, w, h) => sc.fillRect(OX + c, OY + r, w, h);
    const bd = p.bodyDy | 0;
    LEGS.forEach((c, i) => { const top = 8 + bd, bottom = 10 - (p.legs[i] || 0); if (bottom > top) px(c, top, 1, bottom - top); });
    px(3, bd, 12, 8);
    px(1 + p.armL[0], 4 + bd + p.armL[1], 2, 2);
    px(15 + p.armR[0], 4 + bd + p.armR[1], 2, 2);
    if (p.eye > 0) EYES.forEach(c => sc.clearRect(OX + c + p.look, OY + 2 + bd + (2 - p.eye), 1, p.eye));
  }
  function idleBits(off) {
    const t = T + (off || 0);
    let eye = 2;
    const bt = t % 3.4;
    if (bt < 0.07) eye = 1; else if (bt < 0.15) eye = 0; else if (bt < 0.22) eye = 1;
    const gt = t % 6;
    return { eye, look: gt > 3 && gt < 3.9 ? 1 : (gt > 4.2 && gt < 5.1 ? -1 : 0) };
  }
  function playerPose() {
    const p = basePose();
    const ib = idleBits();
    p.eye = ib.eye; p.look = ib.look;
    p.bodyDy = Math.floor(T / 0.7) % 2;
    if (P.moveT < 1) {
      const ph = Math.floor(P.moveT * 4) % 2;
      p.legs = ph ? [0, 1, 0, 1] : [1, 0, 1, 0];
      p.bodyDy = 0;
    }
    if (G.frozen > 0) { p.tint = Math.floor(T / 0.15) % 2 ? '#a8c8d8' : COL.clawd; p.eye = 1; p.bodyDy = 0; }
    const a = P.anim;
    if (!a) return p;
    const t = a.t;
    switch (a.type) {
      case 'attack':
        if (t < 0.07) { p.ox = -a.dx; p.oy = -a.dy; if (a.dx) p.armR = [-1, -2]; p.eye = 1; }
        else if (t < 0.16) { p.ox = a.dx * 4; p.oy = a.dy * 4; if (a.dx) p.armR = [3, 0]; }
        else { const k = ease((t - 0.16) / 0.12); p.ox = Math.round(a.dx * 4 * (1 - k)); p.oy = Math.round(a.dy * 4 * (1 - k)); }
        break;
      case 'hurt':
        if (t < 0.26) {
          p.tint = Math.floor(t / 0.06) % 2 ? COL.white : COL.noise;
          p.ox = Math.floor(t / 0.05) % 2 ? -1 : 1; p.eye = 0; p.armL = [0, -1]; p.armR = [0, -1];
        }
        break;
      case 'tool': {
        const ph = Math.floor(t / 0.07) % 2;
        p.armL = [0, ph ? -1 : 0]; p.armR = [0, ph ? 0 : -1]; p.eye = 1; p.bodyDy = 0;
        break;
      }
      case 'compact':
        if (t < 0.3) { const k = ease(t / 0.3); p.sy = 1 - 0.4 * k; p.sx = 1 + 0.25 * k; p.eye = 0; }
        else if (t < 0.45) { p.sy = 0.6; p.sx = 1.25; p.eye = 0; p.tint = Math.floor(t / 0.05) % 2 ? COL.flash : null; }
        else if (t < 0.65) { const k = ease((t - 0.45) / 0.2); p.sy = 0.6 + 0.6 * k; p.sx = 1.25 - 0.35 * k; }
        else { const k = (t - 0.65) / 0.5, d = Math.exp(-k * 4); p.sy = 1 + 0.2 * Math.cos(k * 14) * d; p.sx = 1 - 0.1 * Math.cos(k * 14) * d; }
        break;
      case 'happy': {
        const k = clamp(t / 0.35, 0, 1);
        p.oy = -Math.round(6 * 4 * k * (1 - k));
        const f = Math.floor(t / 0.1) % 2;
        p.armL = [0, f ? -3 : -1]; p.armR = [0, f ? -1 : -3]; p.eye = 1;
        break;
      }
      case 'push':
        if (t < 0.12) { p.sy = 0.82; p.sx = 1.1; p.eye = 1; }
        else if (t < 0.55) {
          const k = (t - 0.12) / 0.43;
          p.oy = -Math.round(16 * 4 * k * (1 - k)); p.armL = [0, -2]; p.armR = [0, -2];
          p.sy = k < 0.5 ? 1.12 : 1; p.sx = k < 0.5 ? 0.94 : 1;
        } else { const k = clamp((t - 0.55) / 0.2, 0, 1); p.sy = 1 - 0.8 * k; p.sx = 1 + 0.2 * k; p.alpha = 1 - k; }
        break;
      case 'death':
        if (t < 0.35) { p.tint = Math.floor(t / 0.06) % 2 ? COL.white : COL.noise; p.ox = Math.floor(t / 0.04) % 2 ? 1 : -1; p.eye = 0; }
        else p.alpha = 0;
        break;
    }
    return p;
  }
  const ANIM_LEN = { attack: 0.3, hurt: 0.35, tool: 0.45, compact: 1.15, happy: 0.5, push: 1.2 };

  function explodePlayer() {
    paintSprite(basePose());
    const img = sc.getImageData(0, 0, spr.width, spr.height).data;
    const cx = rx(P), fy = ry(P);
    for (let y = 0; y < spr.height; y++) for (let x = 0; x < spr.width; x++) {
      if (img[(y * spr.width + x) * 4 + 3] > 0) {
        const dx = (x - 12) * P.face;
        part({ x: cx + dx, y: fy + (y - 16), vx: dx * vr(1, 4) + vr(-8, 8), vy: vr(-50, -15), g: 120, fy: fy, life: vr(1.2, 1.6), c: Math.random() < 0.12 ? COL.noise : COL.clawd });
      }
    }
    text('Context overflow', COL.noise, cx, fy - 26);
  }

    for (const t of texts) {
      const w = ctx.measureText(t.s).width;
      const x = clamp(t.x, camX + w / 2 + 2, camX + LW - w / 2 - 2);
      const y = t.y - (t.max - t.life) * 8;
      ctx.globalAlpha = Math.min(1, t.life / 0.4);
      ctx.fillStyle = COL.void; ctx.fillText(t.s, x + 0.6, y + 0.6);
      ctx.fillStyle = t.c; ctx.fillText(t.s, x, y);
    }
    ctx.globalAlpha = 1;
  }
  function drawMinimap() {
    const x0 = LW - MW - 4, y0 = 4;
    ctx.globalAlpha = 0.8;
    ctx.fillStyle = 'rgba(13,11,10,0.75)'; ctx.fillRect(x0 - 2, y0 - 2, MW + 4, MH + 4);
    for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) {
      const i = idx(x, y);
      if (!seen[i] || map[i] !== 0) continue;
      ctx.fillStyle = vis[i] ? '#6b5a4c' : '#3a3029';
      ctx.fillRect(x0 + x, y0 + y, 1, 1);
    }
    if (stairs && seen[idx(stairs.x, stairs.y)]) { ctx.fillStyle = COL.ok; ctx.fillRect(x0 + stairs.x - 1, y0 + stairs.y - 1, 3, 3); }
    for (const it of floorItems) if (seen[idx(it.x, it.y)]) { ctx.fillStyle = COL.tool; ctx.fillRect(x0 + it.x, y0 + it.y, 1, 1); }
    for (const e of ents) {
      if (e.type === 'module') { if (seen[idx(e.x, e.y)]) { ctx.fillStyle = COL.stoneHi; ctx.fillRect(x0 + e.x, y0 + e.y, 1, 1); } continue; }
      if (e.type === 'mimic') { if (seen[idx(e.x, e.y)]) { ctx.fillStyle = COL.tool; ctx.fillRect(x0 + e.x, y0 + e.y, 1, 1); } continue; }
      if (vis[idx(e.x, e.y)] || G.grep > 0) { ctx.fillStyle = COL.noise; ctx.fillRect(x0 + e.x, y0 + e.y, 1, 1); }
    }
    for (const a of allies) { ctx.fillStyle = COL.ally; ctx.fillRect(x0 + a.x, y0 + a.y, 1, 1); }
    ctx.fillStyle = Math.floor(T * 3) % 2 ? COL.white : COL.clawd;
    ctx.fillRect(x0 + P.x - 1, y0 + P.y - 1, 3, 3);
    ctx.globalAlpha = 1;
  }
  function drawBossBar() {
    const B = G.boss;
    if (!B || !B.awake || B.dead) return;
    const hp = ents.filter(e => e.type === 'module').reduce((s, e) => s + e.hp, 0);
    const w = 110, x0 = 6, y0 = 6;
    ctx.fillStyle = 'rgba(13,11,10,0.8)'; ctx.fillRect(x0 - 2, y0 - 2, w + 4, 15);
    ctx.font = '5px Silkscreen, monospace'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = COL.noise; ctx.fillText('LEGACY MONOLITH', x0, y0 + 5);
    ctx.fillStyle = '#3a2f28'; ctx.fillRect(x0, y0 + 8, w, 3);
    ctx.fillStyle = COL.noise; ctx.fillRect(x0, y0 + 8, Math.round(w * hp / B.maxHp), 3);
  }

  function render() {
    ctx.setTransform(S, 0, 0, S, 0, 0);
    ctx.imageSmoothingEnabled = false;
    ctx.fillStyle = COL.void; ctx.fillRect(0, 0, LW, LH);
    if (!G) return;
    let camX = Math.round(clamp(rx(P) - LW / 2, 0, MW * TS - LW));
    let camY = Math.round(clamp(ry(P) - 8 - LH / 2, 0, MH * TS - LH));
    let sx = 0, sy = 0;
    if (G.shake > 0) { const m = Math.min(1, G.shake / 0.2) * 2; sx = Math.round(vr(-m, m)); sy = Math.round(vr(-m, m)); }
    ctx.save(); ctx.translate(-camX + sx, -camY + sy);
    const x0 = Math.floor(camX / TS) - 1, y0 = Math.floor(camY / TS) - 1;
    const x1 = x0 + VW + 3, y1 = y0 + VH + 3;
    for (let y = Math.max(0, y0); y <= y1 && y < MH; y++) for (let x = Math.max(0, x0); x <= x1 && x < MW; x++) {
      const i = idx(x, y);
      if (!seen[i]) continue;
      if (map[i] === 0) drawFloorTile(x, y); else if (wallShow[i]) drawWallTile(x, y);
    }
    if (stairs && seen[idx(stairs.x, stairs.y)]) drawStairs();
    for (const it of floorItems) {
      if (!seen[idx(it.x, it.y)]) continue;
      drawItemIcon(it.id, wx(it.x), wy(it.y) - 8 + (Math.floor(T * 2 + it.x) % 2));
    }
    for (const e of ents) if ((e.type === 'mimic' || e.type === 'module') && seen[idx(e.x, e.y)]) drawEnt(e);
    ctx.fillStyle = 'rgba(13,11,10,0.55)';
    for (let y = Math.max(0, y0); y <= y1 && y < MH; y++) for (let x = Math.max(0, x0); x <= x1 && x < MW; x++) {
      const i = idx(x, y);
      if (seen[i] && !vis[i]) ctx.fillRect(x * TS, y * TS, TS, TS);
    }
    drawSlamZone();
    for (const e of ents) {
      if (e.type === 'mimic' || e.type === 'module') continue;
      if (vis[idx(e.x, e.y)] || G.grep > 0) {
        if (!vis[idx(e.x, e.y)]) ctx.globalAlpha = 0.6;
        drawEnt(e);
        ctx.globalAlpha = 1;
      }
    }
    for (const a of allies) drawAlly(a);
    drawPlayer();
    drawRings();
    drawParts();
    drawTexts(camX - sx);
    ctx.restore();
    drawMinimap();
    drawBossBar();
    if (G.trans) {
      const t = G.trans.t;
      const a = t < 0.55 ? 0 : t < 0.8 ? (t - 0.55) / 0.25 : 1 - (t - 0.8) / 0.3;
      if (a > 0) { ctx.fillStyle = `rgba(13,11,10,${clamp(a, 0, 1)})`; ctx.fillRect(0, 0, LW, LH); }
      if (t > 0.6 && t < 1.05) {
        const f = G.trans.swapped ? G.floor : G.floor + 1;
        ctx.globalAlpha = clamp(a, 0, 1);
        ctx.font = '8px Silkscreen, monospace'; ctx.textAlign = 'center';
        ctx.fillStyle = f % 5 === 0 ? COL.noise : COL.clawd;
        ctx.fillText(f % 5 === 0 ? tr('c_floor', f) + ' · Monolith' : tr('c_floor', f), LW / 2, LH / 2);
        ctx.globalAlpha = 1;
      }
    }
  }

  // ---------- HUD ----------
  function hud() {
    if (!G) return;
    const it = itemsSize(), tt = total();
    let rest = 100;
    const seg = (id, v) => { const w = Math.min(rest, v / MAX * 100); rest -= w; el(id).style.width = w + '%'; };
    seg('seg-sys', SYS); seg('seg-items', it); seg('seg-out', G.output); seg('seg-noise', G.noise);
    const val = el('ctx-val');
    val.textContent = `${Math.min(tt, MAX)}k / ${MAX}k`;
    val.className = 'val' + (tt >= MAX * 0.85 ? ' crit' : tt >= MAX * 0.65 ? ' warn' : '');
    el('lg-sys').textContent = SYS + 'k'; el('lg-items').textContent = it + 'k';
    el('lg-out').textContent = G.output + 'k'; el('lg-noise').textContent = G.noise + 'k';
    const cd = el('cd');
    cd.textContent = G.cd ? tr('inTurns', G.cd) : tr('ready');
    cd.className = G.cd ? 'cd-wait' : 'cd-ready';
    el('eff').textContent = tr('eff', Math.round(compactEff() * 100));
    const extra = [];
    if (G.grep) extra.push(tr('grepLeft', G.grep));
    if (allies.length) extra.push(tr('allyLeft', allies[0].life));
    if (G.frozen) extra.push(tr('frozen'));
    el('extra').textContent = extra.length ? ' · ' + extra.join(' · ') : '';
    el('mode').textContent = G.mode === 'daily' ? tr('daily', G.dailyLabel) : '';
    el('floor').textContent = G.floor; el('score').textContent = G.score;
    el('best').textContent = G.mode === 'daily' ? Math.max(dailyBest(), G.score) : Math.max(best, G.score);
    ['read', 'grep', 'bash'].forEach(id => {
      const b = el('b-' + id), i = getItem(id);
      b.disabled = !i;
      b.querySelector('small').textContent = `${ITEMS[id].key} · +${toolCost(id)}k${i && i.sum ? ' · ' + tr('summary') : ''}`;
      b.title = i ? ITEMS[id].desc(i.sum) : tr('notFound', ITEMS[id].name);
    });
    el('b-compact').disabled = G.cd > 0;
    el('b-compact').querySelector('small').textContent = G.cd ? `C · ${G.cd}` : `C · ${Math.round(compactEff() * 100)}%`;
    el('b-clear').disabled = !has('clear');
    el('b-sub').disabled = !has('subagent');
    el('mute').textContent = muted ? tr('soundOff') : tr('soundOn');
    syncMusicButtons();
    renderInv();
  }
  function renderInv() {
    const ul = el('inv'); ul.innerHTML = '';
    if (!G.items.length) { const li = document.createElement('li'); li.className = 'empty'; li.textContent = tr('invEmpty'); ul.appendChild(li); return; }
    for (const it of G.items) {
      const d = ITEMS[it.id];
      const li = document.createElement('li');
      li.innerHTML = `<span class="nm">${d.name}${it.sum ? '<em>' + tr('summary') + '</em>' : ''} <span class="sz">${itemSize(it)}k</span></span><span class="ds">${d.desc(it.sum)}</span>`;
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = tr('forget'); b.title = tr('forgetTitle', d.name);
      b.addEventListener('click', () => dropItem(it.id));
      li.appendChild(b);
      ul.appendChild(li);
    }
  }
  function renderLog() {
    const ul = el('log'); ul.innerHTML = '';
    for (const l of G.log) { const li = document.createElement('li'); li.className = l.cls; li.textContent = l.s; ul.appendChild(li); }
  }

  // ---------- overlays ----------
  const overlay = el('overlay'), card = el('card');
  function perksHtml() {
    return `<ul class="perks">${PERKS.map(p => `<li class="${commits >= p.at ? 'on' : ''}"><span>${perkLabel(p)}</span><span>${Math.min(commits, p.at)} / ${p.at}</span></li>`).join('')}</ul>`;
  }
  function wireButtons() {
    const s = el('btn-start'), d = el('btn-daily'), r = el('btn-hints');
    if (s) s.addEventListener('click', () => start('normal'));
    if (d) d.addEventListener('click', () => start('daily'));
    if (r) r.addEventListener('click', () => { hintsSeen = {}; store.set('cw-hints', '{}'); r.textContent = tr('hintsOn'); r.disabled = true; });
    if (s) s.focus({ preventScroll: true });
  }
  function langRow() {
    return `<div class="row lang" role="group" aria-label="${tr('lang')}">
        <span>${tr('lang')}:</span>
        <button class="link" type="button" data-lang="en" aria-pressed="${LANG === 'en'}">English</button>
        <button class="link" type="button" data-lang="ru" aria-pressed="${LANG === 'ru'}">Русский</button>
        <button class="link" type="button" id="card-mute" aria-pressed="${!muted}">${muted ? tr('soundOff') : tr('soundOn')}</button>
        <button class="link" type="button" id="card-music" aria-pressed="${musicOn}">${musicOn ? tr('musicOn') : tr('musicOff')}</button>
        <button class="link" type="button" id="card-track">${trackLabel()}</button>
      </div>`;
  }
  function showStart() {
    const db = dailyBest();
    card.innerHTML = `
      ${langRow()}
      <h2>Context Window</h2>
      <p>${tr('introP')}</p>
      <ul>${tr('rules')}</ul>
      <div class="row">
        <button class="primary" id="btn-start" type="button">${tr('btnStart')}</button>
        <button class="secondary" id="btn-daily" type="button">${tr('btnDaily', today().label)}${db ? ' · ' + db : ''}</button>
      </div>
      <p>${tr('commitsP', commits)}</p>
      ${perksHtml()}
      <div class="row"><button class="link" id="btn-hints" type="button">${tr('hintsReset')}</button></div>`;
    overlay.hidden = false;
    card.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => {
      setLang(b.dataset.lang);
      if (G && !G.started) newGame('normal');
      showStart();
      const again = card.querySelector(`[data-lang="${LANG}"]`);
      if (again) again.focus({ preventScroll: true });
    }));
    const cm = el('card-mute');
    const cmu = el('card-music');
    if (cmu) cmu.addEventListener('click', toggleMusic);
    const ctk = el('card-track');
    if (ctk) ctk.addEventListener('click', cycleTrack);
    if (cm) cm.addEventListener('click', () => { toggleMute(); cm.textContent = muted ? tr('soundOff') : tr('soundOn'); cm.setAttribute('aria-pressed', String(!muted)); });
    wireButtons();
  }
  function start(mode) {
    audioOn();
    newGame(mode || 'normal');
    G.started = true;
    overlay.hidden = true;
    musicPlay(trackFor(G.floor, G.floor % 5 === 0));
    hud();
  }
  function showDeath() {
    const st = G.stats;
    const daily = G.mode === 'daily';
    card.innerHTML = `
      <h2 class="dead">Context overflow</h2>
      <p>${tr('deadP', G.killedBy || tr('unknown'))}</p>
      <dl class="stats">
        <dt>${tr('st_mode')}</dt><dd>${daily ? tr('st_daily', G.dailyLabel) : tr('st_normal')}</dd>
        <dt>${tr('st_floor')}</dt><dd>${G.floor}</dd>
        <dt>${tr('st_turns')}</dt><dd>${G.turn}</dd>
        <dt>${tr('st_kills')}</dt><dd>${st.kills}</dd>
        <dt>${tr('st_bosses')}</dt><dd>${st.bosses}</dd>
        <dt>${tr('st_comp')}</dt><dd>${st.compactions}</dd>
        <dt>${tr('st_noise')}</dt><dd>${st.noise}k</dd>
        <dt>${tr('st_tools')}</dt><dd>${st.tools}k</dd>
        <dt>${tr('st_score')}</dt><dd>${G.score}</dd>
        <dt>${daily ? tr('st_bestDay') : tr('st_best')}</dt><dd>${daily ? dailyBest() : best}</dd>
      </dl>
      <p>${daily ? tr('dailyNoCommits') : tr('earned', G.earned, commits)}</p>
      ${G.newPerks && G.newPerks.length ? `<p class="new-unlock">${tr('unlocked', G.newPerks.map(perkLabel).join(', '))}</p>` : ''}
      <div class="row">
        <button class="primary" id="btn-start" type="button">${tr('btnNew')}</button>
        <button class="secondary" id="btn-daily" type="button">${tr('btnDaily', today().label)}</button>
      </div>`;
    overlay.hidden = false;
    wireButtons();
    hud();
  }

  // ---------- input ----------
  const MOVES = {
    ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
    KeyW: [0, -1], KeyS: [0, 1], KeyA: [-1, 0], KeyD: [1, 0],
  };
  const ACTIONS = {
    Space: ['wait'], Period: ['wait'],
    KeyR: ['tool', 'read'], KeyG: ['tool', 'grep'], KeyB: ['tool', 'bash'],
    KeyC: ['compact'], KeyX: ['clear'], KeyQ: ['sub'],
  };
  const HOLD_DELAY = 0.15;
  const held = [];
  function press(id, dir) {
    release(id);
    G.interrupt = false;
    held.push({ id, dir, t: T });
    act('move', dir);
  }
  function release(id) {
    const i = held.findIndex(h => h.id === id);
    if (i >= 0) held.splice(i, 1);
  }
  function holdTick() {
    const h = held[held.length - 1];
    if (!h) return;
    if (G.interrupt) { held.length = 0; G.interrupt = false; return; }
    if (T - h.t < HOLD_DELAY) return;
    if (!G.started || G.over || G.queue || busy()) return;
    act('move', h.dir);
  }
  function toggleMute() {
    muted = !muted;
    store.set('cw-mute', muted ? '1' : '0');
    if (!muted) { audioOn(); sfx('pickup'); }
    el('mute').textContent = muted ? tr('soundOff') : tr('soundOn');
    const cm = el('card-mute');
    if (cm) { cm.textContent = muted ? tr('soundOff') : tr('soundOn'); cm.setAttribute('aria-pressed', String(!muted)); }
  }
  function toggleMusic() {
    musicOn = !musicOn;
    store.set('cw-music', musicOn ? '1' : '0');
    if (musicOn) { audioOn(); musicPlay(M.want || (G && G.started ? trackFor(G.floor, G.boss && !G.boss.dead) : 'calm')); }
    else { const w = M.track || M.want; musicStop(); M.want = w; }
    syncMusicButtons();
  }
  function syncMusicButtons() {
    const t = musicOn ? tr('musicOn') : tr('musicOff');
    el('music').textContent = t;
    const cm = el('card-music');
    if (cm) { cm.textContent = t; cm.setAttribute('aria-pressed', String(musicOn)); }
    el('track').textContent = trackLabel();
    const ct = el('card-track');
    if (ct) ct.textContent = trackLabel();
  }

  window.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    audioOn();
    if (e.code === 'KeyM') { toggleMute(); return; }
    if (e.code === 'KeyN') { toggleMusic(); return; }
    if (e.code === 'KeyT') { cycleTrack(); return; }
    if (!G.started || G.over) {
      if (e.key === 'Enter' && !overlay.hidden && (!G.over || G.deathShown) && !(e.target && e.target.tagName === 'BUTTON')) { e.preventDefault(); start('normal'); }
      return;
    }
    const dir = MOVES[e.code];
    if (dir) {
      e.preventDefault();
      if (!e.repeat) press(e.code, dir);
      return;
    }
    const m = ACTIONS[e.code];
    if (!m) return;
    if (e.target && e.target.tagName === 'BUTTON' && (e.code === 'Space' || e.key === 'Enter')) return;
    e.preventDefault();
    if (!e.repeat) act(m[0], m[1]);
  });
  window.addEventListener('keyup', e => release(e.code));
  window.addEventListener('pointerdown', audioOn, { passive: true });
  window.addEventListener('blur', () => { held.length = 0; });

  let touch = null;
  cv.addEventListener('touchstart', e => { audioOn(); const t = e.changedTouches[0]; touch = { x: t.clientX, y: t.clientY }; }, { passive: true });
  cv.addEventListener('touchend', e => {
    if (!touch) return;
    const t = e.changedTouches[0], dx = t.clientX - touch.x, dy = t.clientY - touch.y;
    touch = null;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) act('move', [Math.sign(dx), 0]); else act('move', [0, Math.sign(dy)]);
  }, { passive: true });
  document.querySelectorAll('[data-dir]').forEach(b => {
    const id = 'pad' + b.dataset.dir;
    const dir = b.dataset.dir.split(',').map(Number);
    b.addEventListener('pointerdown', e => { e.preventDefault(); audioOn(); b.setPointerCapture(e.pointerId); press(id, dir); });
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => b.addEventListener(ev, () => release(id)));
    b.addEventListener('contextmenu', e => e.preventDefault());
  });
  document.querySelectorAll('[data-wait]').forEach(b => b.addEventListener('click', () => act('wait')));
  el('b-read').addEventListener('click', () => act('tool', 'read'));
  el('b-grep').addEventListener('click', () => act('tool', 'grep'));
  el('b-bash').addEventListener('click', () => act('tool', 'bash'));
  el('b-compact').addEventListener('click', () => act('compact'));
  el('b-clear').addEventListener('click', () => act('clear'));
  el('b-sub').addEventListener('click', () => act('sub'));
  el('b-wait').addEventListener('click', () => act('wait'));
  el('mute').addEventListener('click', toggleMute);
  el('music').addEventListener('click', toggleMusic);
  el('track').addEventListener('click', cycleTrack);

  // ---------- boot ----------
  applyStatic();
  newGame('normal');
  showStart();
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }
  render();
  requestAnimationFrame(frame);

  // test hook for automated checks
  window.__cw = {
    get G() { return G; }, get P() { return P; }, get ents() { return ents; }, get stairs() { return stairs; },
    get allies() { return allies; }, bfsFrom, idx, act, start, total,
    toFloor(n) { G.floor = n - 1; nextFloor(); hud(); }, setLang,
    get music() { return { track: M.track, step: M.step, ctx: actx && actx.state }; },
    musicLevel(ms) {
      return new Promise(res => {
        if (!M.bus) return res(0);
        const an = actx.createAnalyser(); an.fftSize = 2048; M.bus.connect(an);
        const buf = new Float32Array(an.fftSize); let peak = 0;
        const iv = setInterval(() => { an.getFloatTimeDomainData(buf); for (const v of buf) peak = Math.max(peak, Math.abs(v)); }, 20);
        setTimeout(() => { clearInterval(iv); res(peak); }, ms);
      });
    },
  };
})();
</script>
